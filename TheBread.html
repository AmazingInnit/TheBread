<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>TheBread.com</title>
    
    <style>
        /*BACKGROUND*/
        body 
        {
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            background:#221a13;
            font-family: Arial, sans-serif; 
            text-align: center;
        }
        nav
        {
            text-align: right;
            padding: 10px 16px 0;
        }
        .nav
        {
            background-color: #604917;
            color: white;
            border: none;
            padding: 8px 20px;
            font-size: 15px;
            border-radius: 4px; 
            margin-top: 10px; 
            margin-bottom: 10px; 
            margin-right: 5px;
            cursor: pointer;
        }
        h1 
        {
            font-family: 'Times New Roman', Times, serif;
            font-size: 50px;
            color: #fff6e5;
            text-shadow: 0 2px 6px rgba(0, 0, 0, 0.45);
            margin-bottom: 50px;
        }
        h2
        {
            margin-top: 40px;
            font-family: 'Times New Roman', Times, serif;
            font-size: 25px;
            color: #f5ebd6;
        }
        h3
        {
            font-family: 'Times New Roman', Times, serif;
            font-size: 28px;
            color: #f5ebd6;
            margin-top: 0;
        }
        button:hover 
        {
            background-color: #52270b; 
        }
        p 
        {
            color: #e8dcc4;
            font-family: 'Times New Roman', Times, serif;
            font-size: 19px;
        }
        .button
        {
            background-color: #718328;
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 16px;
            border-radius: 8px;
            width: 200px;
            cursor: pointer;
        }
        .button:hover
        {
            background-color: #565124;
        }
        .background_img
        {
            position: fixed;
            inset: 0;             
            width: 100%;
            height: 100%;
            object-fit: cover;    
            object-position: center;
            z-index: -1;           
            pointer-events: none;
        }
        .stage 
        {
            flex: 1;
            flex-direction: column;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1px;
            position: relative;
            z-index: 1;
        }

        /* The rectangle in the middle */
        .rectangle 
        {
            width: 500px;
            max-width: 100%;   
            min-height: 250px;
            padding: 28px 20px;
            background: rgba(34, 26, 19, 0.78);
            backdrop-filter: blur(1px);
            border: 1px solid rgba(255, 210, 145, 0.25);
            border-radius: 5px;  
        }
        footer p
        {
            color: #fff6e5;
            font-size: 15px;
            text-shadow: 0 1px 4px rgba(0, 0, 0, 0.6);
        }
    </style>
   
</head>
<body>
   
    <header>
        <nav>
            <a href="TheBread Page.html"><button class="nav">TheBread Page</button></a>
            <a href="TheBread.html"><button class="nav">About Us</button></a>
        </nav>
    </header>
  
    <div class="stage">
          <h1>TheBread</h1>
        <div class="rectangle">
            <h3>Your Daily Bread</h3>
            
            <a href="TheBread Register.html"><button class="button">Register</button></a>
            <p>Already have an account?</p>
            <a href="TheBread LogIn.html"><button class="button">Log In</button></a>
        </div>
    </div>

    <img src="TheBread BG.png" alt="Background image" class="background_img"/>

    <footer>
        <p>&copy; 2026 TheBread. All rights reserved.</p>
    </footer>
</body>
</html>
